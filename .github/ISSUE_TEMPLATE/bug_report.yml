name: Bug report
description: Something in the game does not work as expected
labels: ['type: bug']
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A share link (`?p=…`) to the board makes this much easier.
      placeholder: |
        1. Open …
        2. Press …
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Firefox 140 on Windows 11, iPhone 15 Safari, …
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Screenshots, console output, anything else
